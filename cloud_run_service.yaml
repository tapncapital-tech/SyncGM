apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: syncgm-service
  labels:
    cloud.google.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: ${PROJECT_ID}:us-central1:syncgm-postgres
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/${PROJECT_ID}/syncgm:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: syncgm-db-url
                  key: latest
            - name: SYNCGM_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: syncgm-enc-key
                  key: latest
            - name: SYNCGM_SCHEDULER_SECRET
              valueFrom:
                secretKeyRef:
                  name: syncgm-scheduler-secret
                  key: latest
